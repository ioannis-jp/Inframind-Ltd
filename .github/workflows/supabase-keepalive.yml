name: Supabase keep-alive

# Keeps the free-tier Supabase project "inframind-portal" active
# (Supabase pauses free projects after 7 days without activity).
# Read-only ping; makes no commits, so it never triggers a Netlify deploy.

on:
  schedule:
    - cron: '17 6 * * 1,4'   # Mon & Thu 06:17 UTC
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST (keepalive table)
        env:
          SUPABASE_URL: https://ftshckgmjkjiwoeldjug.supabase.co
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          curl -fsS "$SUPABASE_URL/rest/v1/keepalive?select=id,pinged_at&limit=1" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY"
