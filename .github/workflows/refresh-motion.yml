name: Refresh MOTION data

on:
  schedule:
    # Every 10 minutes during Cyprus operating hours.
    # Cyprus = UTC+2 (EET, winter) or UTC+3 (EEST, summer).
    # Cron range 01:00-21:59 UTC covers Cyprus 03:00-00:59 (winter) / 04:00-00:59 (summer)
    # — buffers around the 05:00-23:00 local operating window in both DST regimes.
    # Total: 21h × 6 = 126 runs/day. Data goes to repo only; website fetches from raw
    # GitHub, so Netlify is not rebuilt on data commits.
    - cron: "*/10 1-21 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: refresh-motion
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests gtfs-realtime-bindings protobuf

      - name: Refresh MOTION data
        env:
          MOTION_FEED_URL: ${{ secrets.MOTION_FEED_URL || 'http://20.19.98.194:8328/Api/api/gtfs-realtime' }}
          ROLLING_HOURS: "6"
        run: python scripts/refresh_motion_data.py

      - name: Commit and push if changed
        run: |
          set -e
          git config user.name  "inframind-bot"
          git config user.email "bot@inframind.eu"
          # Stage ALL changed/new files in data/ — covers verification_planned.json,
          # _trip_distances.json, and any new files the script may produce.
          git add -A data/ 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No data changes — nothing to commit."
            exit 0
          fi
          ts=$(date -u +"%Y-%m-%d %H:%M UTC")
          # Site reads data from raw.githubusercontent.com — Netlify rebuild not needed
          # on data-only commits. The skip directive is in the commit BODY (next line),
          # not in this human-readable subject, so editors that show subjects only stay clean.
          git commit -m "chore(data): refresh MOTION stats - $ts" -m "skip-netlify-build"
          # Resilient push: retry with rebase if a concurrent bot run pushed first.
          # Always stash any unstaged residue before rebasing so we never block.
          push_ok=0
          for i in 1 2 3; do
            if git push; then push_ok=1; break; fi
            echo "push failed (attempt $i), syncing with remote..."
            git stash -u 2>/dev/null || true
            git pull --rebase --autostash || true
            git stash pop 2>/dev/null || true
          done
          if [ "$push_ok" != "1" ]; then
            git push || (echo "final push failed" && exit 1)
          fi
