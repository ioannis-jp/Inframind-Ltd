name: Refresh MOTION data

on:
  schedule:
    # Native GitHub cron is unreliable at sub-hour cadences. We keep a low-rate
    # safety cron here, but the primary trigger is the Cloudflare Worker which
    # fires workflow_dispatch every 5 minutes (data refresh) + at 6h boundaries
    # with deploy=true to fire a Netlify rebuild.
    - cron: "0 3,9,15,21 * * *"
  workflow_dispatch:
    inputs:
      deploy:
        description: "Set to 'true' to OMIT [skip ci] so Netlify rebuilds. Default 'false' = data-only commit."
        required: false
        default: "false"
        type: string

permissions:
  contents: write

concurrency:
  group: refresh-motion
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Always check out the CURRENT tip of main, not github.sha.
          # For workflow_dispatch, github.sha is resolved when the run is
          # QUEUED; with 5-min dispatches + the concurrency queue, runs often
          # start on a stale sha, commit on an old base, and fail to push
          # (observed 2026-07-09: runs 10955/10964/10968).
          ref: main
          # Enough history for the self-scheduled deploy check below to see
          # the last "(6h deploy)" commit (~12 data commits/h × 6h + margin).
          fetch-depth: 150

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests gtfs-realtime-bindings protobuf

      - name: Refresh MOTION data
        env:
          MOTION_FEED_URL: ${{ secrets.MOTION_FEED_URL || 'http://20.19.98.194:8328/Api/api/gtfs-realtime' }}
          ROLLING_HOURS: "6"
        run: python scripts/refresh_motion_data.py

      - name: Commit and push if changed
        env:
          DEPLOY_INPUT: ${{ github.event.inputs.deploy }}
        run: |
          set -e
          git config user.name  "inframind-bot"
          git config user.email "bot@inframind.eu"
          # Stage ALL data/ changes incl. new files (trip_distances, today_schedule, etc.)
          git add -A data/ 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No data changes — nothing to commit."
            exit 0
          fi
          ts=$(date -u +"%Y-%m-%d %H:%M UTC")

          # Default commits use [skip ci] so Netlify does NOT rebuild (data is
          # fetched directly from raw.githubusercontent.com — no rebuild needed).
          #
          # Deploy decision (self-scheduled — does NOT depend on the Cloudflare
          # Worker version, which was found on 2026-06-10 to never send
          # deploy=true):
          #   1. Explicit workflow_dispatch input deploy=true always deploys.
          #   2. Otherwise, during the 00/06/12/18 UTC hours, the FIRST run
          #      that finds no "(6h deploy)" commit in the last 5 hours
          #      deploys. Max 4 deploys/day = 60 credits/day cap.
          DO_DEPLOY=0
          if [ "${DEPLOY_INPUT:-false}" = "true" ]; then
            DO_DEPLOY=1
            echo "[deploy-check] explicit deploy=true input"
          else
            hour=$(date -u +%H)
            case "$hour" in
              00|06|12|18)
                if git log --since="5 hours ago" --grep="(6h deploy)" --oneline | grep -q .; then
                  echo "[deploy-check] hour $hour UTC but a deploy already happened in the last 5h — skip"
                else
                  DO_DEPLOY=1
                  echo "[deploy-check] hour $hour UTC, no deploy in last 5h — deploying"
                fi
                ;;
              *)
                echo "[deploy-check] hour $hour UTC — data-only"
                ;;
            esac
          fi

          if [ "$DO_DEPLOY" = "1" ]; then
            COMMIT_MSG="chore(data): refresh MOTION stats - $ts (6h deploy)"
            echo "[commit] Deploy commit (no [skip ci]) — Netlify WILL rebuild."
          else
            COMMIT_MSG="chore(data): refresh MOTION stats - $ts [skip ci]"
            echo "[commit] Data-only commit ([skip ci]) — Netlify will skip."
          fi
          git commit -m "$COMMIT_MSG"

          # Resilient push: retry with rebase if a concurrent run pushed first.
          # Data commits ALWAYS conflict (every run rewrites the same JSON
          # files), so plain `pull --rebase` dies on conflicts. `-X theirs`
          # (in a rebase, "theirs" = OUR replayed commit) keeps our freshly
          # generated data, which by definition is the newest.
          push_ok=0
          for i in 1 2 3; do
            if git push; then push_ok=1; break; fi
            echo "push failed (attempt $i), rebasing onto latest main (keeping our data)..."
            git rebase --abort 2>/dev/null || true
            git fetch origin main
            git rebase -X theirs origin/main || git rebase --abort 2>/dev/null || true
          done
          if [ "$push_ok" != "1" ]; then
            git push || (echo "final push failed" && exit 1)
          fi
