name: Refresh MOTION data

on:
  schedule:
    # Every 10 minutes during Cyprus operating hours.
    # Cyprus = UTC+2 (EET, winter) or UTC+3 (EEST, summer).
    # Cron range 01:00-21:59 UTC covers Cyprus 03:00-00:59 (winter) / 04:00-00:59 (summer)
    # — buffers around the 05:00-23:00 local operating window in both DST regimes.
    # Total: 21h × 6 = 126 runs/day. Data goes to repo only; website fetches from raw
    # GitHub, so Netlify is not rebuilt on data commits.
    - cron: "*/10 1-21 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: refresh-motion
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests gtfs-realtime-bindings protobuf

      - name: Refresh MOTION data
        env:
          MOTION_FEED_URL: ${{ secrets.MOTION_FEED_URL || 'http://20.19.98.194:8328/Api/api/gtfs-realtime' }}
          ROLLING_HOURS: "6"
        run: python scripts/refresh_motion_data.py

      - name: Commit and push if changed
        run: |
          git config user.name  "inframind-bot"
          git config user.email "bot@inframind.eu"
          git add \
            data/motion-stats.json \
            data/planned.json \
            data/_rolling_snapshots.json \
            data/daily_executed.json \
            data/daily_history.json \
            data/_trip_distances.json \
            2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No data changes — nothing to commit."
            exit 0
          fi
          ts=$(date -u +"%Y-%m-%d %H:%M UTC")
          # [skip netlify] in message — site reads data from raw.githubusercontent.com,
          # no rebuild needed on data refreshes.
          git commit -m "chore(data): refresh MOTION stats — $ts [skip netlify]"
          # Resilient push (concurrent run may have just pushed)
          for i in 1 2 3; do
            if git push; then exit 0; fi
            echo "push failed (attempt $i), rebasing..."
            git pull --rebase
          done
          git push
